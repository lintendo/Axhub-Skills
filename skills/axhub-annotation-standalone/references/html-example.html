<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axhub Annotation HTML Example</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        color: #111827;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.6;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 32px;
      }

      button {
        padding: 7px 14px;
        border: 1px solid #9ca3af;
        border-radius: 6px;
        background: #ffffff;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      button[aria-pressed="true"] {
        border-color: #0f766e;
        background: #ccfbf1;
        color: #134e4a;
      }

      [data-page] {
        max-width: 760px;
      }

      [data-annotation-id] {
        position: relative;
        padding-top: 8px;
      }

      h1,
      h2 {
        margin: 0 0 18px;
        line-height: 1.2;
      }

      p {
        margin: 0;
      }

      .example-modal-layer {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: rgba(17, 24, 39, 0.5);
      }

      .example-modal-layer[hidden] {
        display: none;
      }

      .example-modal-layer [role="dialog"] {
        width: min(420px, calc(100% - 32px));
        padding: 24px;
        border-radius: 8px;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <nav>
      <button type="button" data-route="overview" aria-pressed="true">运行时总览</button>
      <button type="button" data-route="states" aria-pressed="false">状态标注</button>
    </nav>

    <section data-page="overview">
      <section data-annotation-id="overview-hero">
        <h1>@axhub/annotation</h1>
        <p>这是一个普通 HTML 宿主接入示例。</p>
      </section>
      <button type="button" data-annotation-id="modal-background-target" data-modal-open>
        新建发布任务
      </button>
    </section>

    <section data-page="states" hidden>
      <article data-annotation-id="state-card">
        <strong data-result-label>成功</strong>
        <h2 data-result-title>发布完成</h2>
        <p>在标注面板里切换结果状态，页面会同步变化。</p>
      </article>
    </section>

    <div class="example-modal-layer" data-open="false" hidden>
      <section role="dialog" aria-modal="true" data-annotation-id="modal-content-target">
        <h2>新建发布任务</h2>
        <button type="button" data-modal-close>关闭</button>
      </section>
    </div>

    <script src="./axhub-annotation.global.js"></script>
    <script>
      const annotationSource = {
        documentVersion: 1,
        format: 'axhub-annotation-source',
        presentation: {
          layerSelectors: ['.example-modal-layer[data-open="true"]'],
        },
        data: {
          version: 2,
          prototypeName: 'standalone-annotation-demo',
          pageId: 'overview',
          updatedAt: 1779667200000,
          nodes: [
            {
              id: 'overview-hero',
              index: 1,
              title: '运行时总览',
              pageId: 'overview',
              locator: {
                selectors: ['[data-annotation-id="overview-hero"]'],
                fingerprint: 'section|overview-hero',
                path: [],
              },
              aiPrompt: '说明独立页面如何接入标注运行时。',
              annotationText: '',
              hasMarkdown: true,
              color: '#D97706',
              images: [],
              createdAt: 1779667200000,
              updatedAt: 1779667200000,
            },
            {
              id: 'state-card',
              index: 2,
              title: '结果状态',
              pageId: 'states',
              locator: {
                selectors: ['[data-annotation-id="state-card"]'],
                fingerprint: 'article|state-card',
                path: [],
              },
              aiPrompt: '演示标注 controls 如何驱动页面状态。',
              annotationText: '在标注面板里切换结果状态，页面应该同步展示成功或失败。',
              hasMarkdown: false,
              color: '#059669',
              images: [],
              controls: [
                {
                  type: 'segmented',
                  attributeId: 'result_state',
                  displayName: '结果状态',
                  initialValue: 'success',
                  options: [
                    { label: '成功', value: 'success' },
                    { label: '失败', value: 'failure' },
                  ],
                },
              ],
              createdAt: 1779667200000,
              updatedAt: 1779667200000,
            },
            {
              id: 'modal-background-target',
              index: 3,
              title: '打开发布任务',
              pageId: 'overview',
              locator: {
                selectors: ['[data-annotation-id="modal-background-target"]'],
                fingerprint: 'button|modal-background-target',
                path: [],
              },
              aiPrompt: '说明弹窗打开后的背景标注可见性。',
              annotationText: '弹窗打开时隐藏背景 marker，关闭后恢复。',
              hasMarkdown: false,
              color: '#0F766E',
              images: [],
              createdAt: 1779667200000,
              updatedAt: 1779667200000,
            },
            {
              id: 'modal-content-target',
              index: 4,
              title: '发布任务弹窗',
              pageId: 'overview',
              locator: {
                selectors: ['[data-annotation-id="modal-content-target"]'],
                fingerprint: 'section|modal-content-target',
                path: [],
              },
              aiPrompt: '说明活动前景层内的标注。',
              annotationText: '弹窗内容位于活动层根内，marker 保持可见。',
              hasMarkdown: false,
              color: '#E11D48',
              images: [],
              createdAt: 1779667200000,
              updatedAt: 1779667200000,
            },
          ],
        },
        markdownMap: {
          'overview-hero':
            '# 独立接入说明\n\n`@axhub/annotation` 只负责运行时展示。宿主页面负责提供数据源、稳定选择器和目录 route 行为。',
        },
        assetMap: {},
        directory: {
          nodes: [
            {
              type: 'folder',
              id: 'demo-root',
              title: '示例目录',
              defaultExpanded: true,
              children: [
                {
                  type: 'route',
                  id: 'route-overview',
                  title: '运行时总览',
                  route: 'overview',
                },
                {
                  type: 'route',
                  id: 'route-states',
                  title: '状态标注',
                  route: 'states',
                },
                {
                  type: 'markdown',
                  id: 'doc-usage',
                  title: '接入说明',
                  markdown:
                    '# 接入说明\n\nReact 使用 `AnnotationViewer`；普通 HTML 使用 `createAnnotationViewer`。',
                },
                {
                  type: 'link',
                  id: 'docs-link',
                  title: '包文档',
                  href: 'https://www.npmjs.com/package/@axhub/annotation',
                  target: 'blank',
                },
              ],
            },
          ],
        },
      };

      let currentPageId = 'overview';

      function normalizePageId(value) {
        return value === 'states' ? 'states' : 'overview';
      }

      function renderPage(pageId) {
        currentPageId = pageId;
        document.querySelectorAll('[data-page]').forEach((page) => {
          page.hidden = page.dataset.page !== pageId;
        });
        document.querySelectorAll('[data-route]').forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.route === pageId));
        });
      }

      function renderState(state) {
        const isFailure = state.result_state === 'failure';
        const label = document.querySelector('[data-result-label]');
        const title = document.querySelector('[data-result-title]');

        if (label) label.textContent = isFailure ? '失败' : '成功';
        if (title) title.textContent = isFailure ? '发布失败' : '发布完成';
      }

      const axhubAnnotation = window.AxhubAnnotation;

      if (!axhubAnnotation) {
        throw new Error('Missing window.AxhubAnnotation browser bundle.');
      }

      const viewer = axhubAnnotation.createAnnotationViewer({
        source: annotationSource,
        options: {
          getCurrentPageId: () => currentPageId,
          showToolbar: true,
          showThemeToggle: true,
          showColorFilter: true,
          onDirectoryRoute: (node) => {
            renderPage(normalizePageId(node.route));
            viewer.refresh();
          },
        },
      });

      document.querySelectorAll('[data-route]').forEach((button) => {
        button.addEventListener('click', () => {
          renderPage(normalizePageId(button.dataset.route));
          viewer.refresh();
        });
      });

      const modalLayer = document.querySelector('.example-modal-layer');
      document.querySelector('[data-modal-open]')?.addEventListener('click', () => {
        modalLayer.hidden = false;
        modalLayer.dataset.open = 'true';
        viewer.refresh();
      });
      document.querySelector('[data-modal-close]')?.addEventListener('click', () => {
        modalLayer.dataset.open = 'false';
        modalLayer.hidden = true;
        viewer.refresh();
      });

      void viewer.start().then(() => {
        const attach = () => {
          const protoDev = window.__AXHUB_PROTO_DEV__;
          if (!protoDev) {
            window.setTimeout(attach, 80);
            return;
          }

          renderState(protoDev.getState());
          protoDev.subscribe(() => renderState(protoDev.getState()));
        };

        attach();
      });

      renderPage(currentPageId);
    </script>
  </body>
</html>
